[package]
name = "pyinstruction-decoder"
version = "0.1.5"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "pyinstruction_decoder"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.27.1"
regex = "1.12.2"
load_file = "1.0.1"
instruction-decoder = { path = "instruction-decoder" }
